name: CI
# Checks only. The site is deployed by Cloudflare Pages and the AI server by Cloud Run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server --ignore-scripts
      - run: npm run typecheck
      - run: npx tsc -p server
      - run: npm test
      - run: npm run build
      - run: npm run build --prefix server
